version: 1
# Each group binds sysq recipes. The UI is group-agnostic: adding a group is
# adding an entry here (and, if needed, recipes in sysq).
#   headline:  the big figure (recipe + column)
#   metrics:   one or two supporting figures under the sparkline
#   detail:    every column shown in the drill-in Metrics panel
#   consumers: who is using it (value = the column the bar shows; name = label column)
#   sparkline: history series for the small chart
#   attention: recipe that turns thresholds.yaml into a status color
# Large view header sentence, and the recipe that profiles one item
# (process, app, path, model) for the Actions panel and the assistant.
overview: health.overview
item_profile: item.profile
groups:
  - id: memory
    name: Memory
    symbol: memorychip
    headline:  { recipe: mem.headline, column: available, label: available }
    metrics:
      - { recipe: mem.headline, column: pressure, label: pressure }
      - { recipe: mem.headline, column: swap_used, label: swap }
    detail:    { recipe: mem.detail }
    consumers: { recipe: proc.top, params: { by: mem, n: 10 }, value: mem, name: command, kind: process, id: pid }
    sparkline: { recipe: mem.headline, column: available, range: 5m }
    attention: attention.memory
    reclaimable: { recipe: mem.inactive_holders, column: memory }
  - id: cpu
    name: CPU
    symbol: cpu
    headline:  { recipe: cpu.headline, column: load_pct }
    metrics:
      - { recipe: cpu.headline, column: load1, label: load }
    detail:    { recipe: cpu.cores }
    consumers: { recipe: proc.top, params: { by: cpu, n: 10 }, value: cpu, name: command, kind: process, id: pid }
    sparkline: { recipe: cpu.headline, column: load_pct, range: 5m }
    attention: attention.cpu
  - id: gpu
    name: GPU & Neural Engine
    symbol: sparkles
    headline:  { recipe: gpu.headline, column: utilization }
    metrics:
      - { recipe: gpu.headline, column: in_use_mem, label: in use }
    detail:    { recipe: gpu.stats }
    consumers: { recipe: ai.gpu_holders, value: gpu_mem, name: name, kind: process, id: pid }
    sparkline: { recipe: gpu.headline, column: utilization, range: 5m }
    attention: attention.gpu
  - id: storage
    name: Storage
    symbol: internaldrive
    headline:  { recipe: disk.headline, column: free, label: free }
    metrics:
      - { recipe: disk.headline, column: used_pct, label: used }
    detail:    { recipe: disk.volumes }
    consumers: { recipe: disk.hogs, params: { root: "~", depth: 1 }, value: size, name: name, kind: path, id: path }
    sparkline: { recipe: disk.headline, column: free, range: 24h }
    attention: attention.storage
    reclaimable: { recipe: disk.caches, column: size }
  - id: network
    name: Network
    symbol: network
    headline:  { recipe: net.headline, column: throughput, unit: bytes/s }
    metrics:
      - { recipe: net.headline, column: in_rate, label: in, unit: bytes/s }
      - { recipe: net.headline, column: out_rate, label: out, unit: bytes/s }
    detail:    { recipe: net.throughput }
    consumers: { recipe: net.by_process, value: bytes, name: command, kind: process, id: pid }
    sparkline: { recipe: net.headline, column: throughput, range: 5m }
    attention: attention.network
  - id: battery
    name: Battery & Power
    symbol: battery.75
    headline:  { recipe: battery.headline, column: level, unit: "%" }
    metrics:
      - { recipe: battery.headline, column: source, label: "on" }
      - { recipe: battery.headline, column: remaining, label: left }
    detail:    { recipe: battery.state }
    consumers: { recipe: proc.energy, value: power, name: command, kind: process, id: pid }
    sparkline: { recipe: battery.headline, column: level, range: 24h }
    attention: attention.battery
  - id: thermal
    name: Thermals
    symbol: thermometer
    headline:  { recipe: thermal.headline, column: state }
    metrics:
      - { recipe: thermal.headline, column: level, label: level }
    detail:    { recipe: thermal.state }
    consumers: { recipe: proc.top, params: { by: cpu, n: 10 }, value: cpu, name: command, kind: process, id: pid, note: "estimated from CPU" }
    sparkline: { recipe: thermal.headline, column: level, range: 1h }
    attention: attention.thermal
  - id: local_ai
    name: Local AI
    symbol: brain
    headline:  { recipe: ai.headline, column: models_loaded, label: models loaded }
    metrics:
      - { recipe: ai.headline, column: memory_held, label: held }
    detail:    { recipe: ai.ollama }
    consumers: { recipe: ai.ollama, value: memory, name: model, kind: model, id: model }
    sparkline: { recipe: ai.headline, column: memory_held, range: 1h }
    attention: attention.local_ai
    reclaimable: { recipe: ai.idle_models, column: memory }
