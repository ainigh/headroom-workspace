version: "2"
linters:
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Fprint
        - (*os.File).Close
        - os.RemoveAll
        - os.Remove
        - (io.Closer).Close
        - (net.Conn).Close
        - (net.Listener).Close
        - (*database/sql.Rows).Close
  exclusions:
    rules:
      - path: _test\.go
        linters: [errcheck]
