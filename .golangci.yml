version: "2"
linters:
  settings:
    staticcheck:
      checks: ["all", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022", "-QF1001", "-QF1002", "-QF1003", "-QF1008"]
    errcheck:
      exclude-functions:
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Fprint
        - (*os.File).Close
        - os.RemoveAll
        - os.Remove
        - (io.Closer).Close
        - (net.Conn).Close
        - (net.Listener).Close
        - (*database/sql.Rows).Close
  exclusions:
    rules:
      - path: _test\.go
        linters: [errcheck]
