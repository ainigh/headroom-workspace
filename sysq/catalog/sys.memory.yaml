name: sys.memory
doc: Memory as Activity Monitor shows it (used = app + wired + compressed), swap, and pressure.
cost: cheap
sensitivity: public
commands:
  - { id: vm_stat, argv: ["/usr/bin/vm_stat"] }
  - id: sysctl
    argv: ["/usr/sbin/sysctl", "hw.memsize", "vm.swapusage", "kern.memorystatus_vm_pressure_level"]
    allow_exit: [1]
  - { id: memory_pressure, argv: ["/usr/bin/memory_pressure"], optional: true }
parser: sys_memory
timeout: 5s
cache_ttl: 2s
schema:
  - { name: total,        type: bytes }
  - { name: used,         type: bytes }
  - { name: available,    type: bytes }
  - { name: free,         type: bytes }
  - { name: app,          type: bytes }
  - { name: wired,        type: bytes }
  - { name: compressed,   type: bytes }
  - { name: cached,       type: bytes }
  - { name: purgeable,    type: bytes }
  - { name: inactive,     type: bytes }
  - { name: swap_total,   type: bytes }
  - { name: swap_used,    type: bytes }
  - { name: pressure,     type: enum, values: [normal, warn, critical] }
  - { name: pressure_pct, type: float, unit: "%" }
  - { name: free_pct,     type: float, unit: "%" }
  - { name: page_size,    type: bytes }
  - { name: pageouts,     type: int }
  - { name: swapins,      type: int }
  - { name: swapouts,     type: int }
