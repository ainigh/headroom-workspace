name: git.status
doc: Working-tree state of one git repository (branch, upstream, ahead/behind, changed and untracked counts). Never fetches.
params:
  path: { type: path, required: true, must_exist: true }
cost: cheap
sensitivity: personal
argv: ["{binary}", "--no-optional-locks", "-C", "{path}", "status", "--porcelain=v2", "--branch"]
binary_paths: ["/opt/homebrew/bin/git", "/usr/local/bin/git", "/Library/Developer/CommandLineTools/usr/bin/git", "/Applications/Xcode.app/Contents/Developer/usr/bin/git"]
parser: git_status
timeout: 10s
cache_ttl: 10s
sandbox_exec: ["/Library/Developer/CommandLineTools/", "/Applications/Xcode.app/Contents/Developer/"]
fixture_params: { path: "~/Developer/headroom" }
schema:
  - { name: path,      type: path }
  - { name: branch,    type: str }
  - { name: upstream,  type: str }
  - { name: ahead,     type: int }
  - { name: behind,    type: int }
  - { name: changed,   type: int }
  - { name: untracked, type: int }
  - { name: clean,     type: bool }
