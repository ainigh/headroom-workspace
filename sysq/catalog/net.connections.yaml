name: net.connections
doc: Open internet sockets (TCP and UDP) of this user's processes, with remote ends and TCP state.
cost: moderate
sensitivity: personal
argv: ["/usr/sbin/lsof", "-nP", "-i", "-FpcuftPnT"]
allow_exit: [1]
parser: lsof_net
timeout: 8s
cache_ttl: 5s
schema:
  - { name: pid,            type: pid }
  - { name: command,        type: str }
  - { name: uid,            type: uid }
  - { name: family,         type: str }
  - { name: proto,          type: str }
  - { name: address,        type: str }
  - { name: port,           type: port }
  - { name: remote_address, type: str }
  - { name: remote_port,    type: port }
  - { name: state,          type: str }
